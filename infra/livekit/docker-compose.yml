# Local POC only. Binds the published ports to loopback.
# Dev mode is the upstream local mode and is not a production configuration.
services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
